server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /playroom {
        return 308 /playroom/;
    }

    location = /playroom-mobile {
        return 308 /playroom-mobile/;
    }

    location = /playroom-desktop {
        return 308 /playroom-desktop/;
    }

    location /playroom/ {
        try_files $uri $uri/ /playroom/index.html;
    }

    location /playroom-mobile/ {
        try_files $uri $uri/ /playroom-mobile/index.html;
    }

    location /playroom-desktop/ {
        try_files $uri $uri/ /playroom-desktop/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
