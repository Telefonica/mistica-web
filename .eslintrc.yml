root: true
extends:
    - '@telefonica/eslint-config'
    - 'plugin:storybook/recommended'
plugins:
    - mistica-local-rules
overrides:
    # import/no-restricted-paths is silent without a resolver that knows ts. Scoped: repo wide it breaks other rules.
    - files:
          - 'src/sidenav-bar*.tsx'
          - 'src/navigation-bar.tsx'
      settings:
          import/resolver:
              node:
                  extensions: ['.js', '.ts', '.tsx']
    - files:
          - '*.js'
      parser: espree
      env:
          node: true
          es2020: true
    - files:
          - '.storybook/**/*.{js,ts,tsx}'
          - 'src/__stories__/**/*.{js,ts,tsx}'
          - 'playroom/**/*.{js,ts,tsx}'
          - '**/*-test.tsx'
          - '**/*-story.tsx'
      rules:
          mistica-local-rules/use-client: 'off'
    - files:
          - '*.tsx'
      rules:
          no-restricted-imports:
              - error
              - patterns:
                    - group:
                          - '@vanilla-extract/css'
                          - '**/sprinkles.css'
                      message: This package should only be imported in css files
rules:
    import/extensions:
        - error
        - js: never
          json: always
          css: always
    # Sidenav and navigation bar only share code through navigation-shared and mobile-navigation-menu
    import/no-restricted-paths:
        - error
        - zones:
              - target: './src/sidenav-bar*.tsx'
                from: './src/navigation-bar.tsx'
                message: Import the shared parts from navigation-shared or mobile-navigation-menu
              - target: './src/sidenav-bar*.tsx'
                from: './src/navigation-bar.css.ts'
                message: Import the shared parts from navigation-shared or mobile-navigation-menu
              - target: './src/navigation-bar.tsx'
                from: './src/sidenav-bar*.tsx'
                message: The navigation bar must not depend on the sidenav
    mistica-local-rules/use-client: error
