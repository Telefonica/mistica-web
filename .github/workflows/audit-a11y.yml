name: Accessibility runtime benchmark
on:
    push:
        branches:
            - alex/1726-a11y-ci-benchmark
permissions:
    contents: read
jobs:
    compare:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - run: corepack enable
            - run: yarn install --immutable --immutable-cache
            - run: yarn storybook-static
            - name: Prepare the CI image
              run: node .github/actions/audit-accessibility/runtime-benchmark.cjs prepare-container
            - name: Prepare native Chromium
              run: node .github/actions/audit-accessibility/runtime-benchmark.cjs prepare-native
            - name: Audit inside the CI container
              run: node .github/actions/audit-accessibility/runtime-benchmark.cjs container
            - name: Audit without a container
              if: ${{ !cancelled() }}
              run: node .github/actions/audit-accessibility/runtime-benchmark.cjs native
            - name: Compare per-case results and timings
              if: ${{ !cancelled() }}
              run: node .github/actions/audit-accessibility/runtime-benchmark.cjs compare
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: accessibility-runtime-benchmark
                  path: |
                      reports/a11y-runtime-benchmark/summary.json
                      reports/a11y-runtime-benchmark/outcomes-*.json
                  retention-days: 7
