name: audit-a11y
on: [pull_request]

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: audit-a11y-${{ github.ref }}
    cancel-in-progress: true

jobs:
    audit-a11y:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.64.1-noble
            options: --ipc=host
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable --immutable-cache

            - name: 'Build storybook'
              run: 'yarn storybook-static'

            - name: 'Audit accessibility'
              uses: './.github/actions/audit-accessibility'
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  azure-account-name: ${{ secrets.AZURE_ACCOUNT_NAME }}
                  azure-account-key: ${{ secrets.AZURE_ACCOUNT_KEY }}
                  fork-pr: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
