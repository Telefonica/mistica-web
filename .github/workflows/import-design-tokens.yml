name: Import design tokens
on:
    workflow_dispatch:
        inputs:
            ref:
                description: 'mistica-design repo changeset or branch'
                required: false
                default: 'production'
            draft:
                type: boolean
                description: 'Create a draft PR'
                required: false
                default: false
            branch:
                description: 'Branch name for the PR. By default it is "import-design-tokens-production"'
                required: false
                default: 'import-design-tokens-production'
            include-skins:
                type: boolean
                description: 'Include the TS skins (src/skins)'
                required: false
                default: true
            include-community-skins:
                type: boolean
                description: 'Include the community TS skins (src/community/skins)'
                required: false
                default: false
            include-css:
                type: boolean
                description: 'Include the CSS files (css/*.css)'
                required: false
                default: false
            include-community-css:
                type: boolean
                description: 'Include the community CSS files (css/community)'
                required: false
                default: false

permissions:
    contents: write
    pull-requests: write

jobs:
    import-design-tokens:
        runs-on: ubuntu-latest
        # Requires manual approval - uses GH_TOKEN_MISTICA to access private repo
        environment: production
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Validate ref input
              id: validate
              env:
                  REF_INPUT: ${{ github.event.inputs.ref }}
              run: |
                  # Validate: only safe characters for git refs
                  if ! echo "$REF_INPUT" | grep -qE '^[a-zA-Z0-9._/-]+$'; then
                    echo "Error: Invalid ref format"
                    exit 1
                  fi
                  echo "ref=$REF_INPUT" >> $GITHUB_OUTPUT

            - name: Checkout mistica-design repo
              uses: actions/checkout@v6
              with:
                  repository: Telefonica/mistica-design
                  path: '.github/mistica-design'
                  ref: ${{ steps.validate.outputs.ref }}
                  # Requires GH_TOKEN_MISTICA to access private Telefonica/mistica-design repo
                  token: ${{ secrets.GH_TOKEN_MISTICA }}
                  persist-credentials: false

            - uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Install dependencies
              env:
                  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
              run: yarn install --immutable --immutable-cache

            - name: Generate skins from design tokens
              run: cd packages/generate-design-tokens && yarn && yarn generate

            - name: Select outputs
              id: outputs
              env:
                  INCLUDE_SKINS: ${{ inputs.include-skins }}
                  INCLUDE_COMMUNITY_SKINS: ${{ inputs.include-community-skins }}
                  INCLUDE_CSS: ${{ inputs.include-css }}
                  INCLUDE_COMMUNITY_CSS: ${{ inputs.include-community-css }}
              run: |
                  prettier_paths=()
                  add_paths=()
                  if [ "$INCLUDE_SKINS" = "true" ]; then
                    prettier_paths+=("src/skins")
                    add_paths+=("src/skins")
                  fi
                  if [ "$INCLUDE_COMMUNITY_SKINS" = "true" ]; then
                    prettier_paths+=("src/community/skins")
                    add_paths+=("src/community/skins")
                  fi
                  # css/community is a separate output, so these globs must not reach the subfolder
                  if [ "$INCLUDE_CSS" = "true" ]; then
                    prettier_paths+=("css/*.css")
                    add_paths+=(":(glob)css/*.css")
                  fi
                  if [ "$INCLUDE_COMMUNITY_CSS" = "true" ]; then
                    prettier_paths+=("css/community")
                    add_paths+=("css/community")
                  fi
                  if [ ${#add_paths[@]} -eq 0 ]; then
                    echo "Error: select at least one output"
                    exit 1
                  fi
                  echo "prettier-paths=${prettier_paths[*]}" >> $GITHUB_OUTPUT
                  {
                    echo "add-paths<<EOF"
                    printf '%s\n' "${add_paths[@]}"
                    echo "EOF"
                  } >> $GITHUB_OUTPUT

            - name: Prettier
              env:
                  PRETTIER_PATHS: ${{ steps.outputs.outputs.prettier-paths }}
              # Unquoted on purpose: the shell splits the list and prettier expands the globs
              run: |
                  set -f
                  yarn prettier $PRETTIER_PATHS --write

            - name: Create Pull Request
              uses: peter-evans/create-pull-request@v5
              with:
                  token: ${{ secrets.GH_TOKEN_MISTICA }}
                  add-paths: ${{ steps.outputs.outputs.add-paths }}
                  commit-message: 'feat(skin): update design tokens'
                  title: 'feat(skin): update design tokens'
                  branch: ${{github.event.inputs.branch}}
                  reviewers: 'atabel,pladaria'
                  delete-branch: true
                  draft: ${{github.event.inputs.draft}}
