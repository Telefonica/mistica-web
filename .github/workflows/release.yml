name: Release
on:
    workflow_dispatch:
        inputs:
            cliArgs:
                description: 'CLI args'
                required: false
                default: ''

jobs:
    validate:
        name: Validate release
        runs-on: ubuntu-latest
        # Only the scope needed by the `git push --dry-run` check of semantic-release. The token dies with the job.
        permissions:
            contents: write
        # No environment on purpose: this job runs before the approval and must not touch the release secrets.
        # The next version is written to the job summary, so the approver reads it before approving the release job.
        outputs:
            safe_args: ${{ steps.validate-args.outputs.safe_args }}
            next_version: ${{ steps.dry-run.outputs.next_version }}
        steps:
            - uses: actions/checkout@v6
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  persist-credentials: false

            - name: Install dependencies
              env:
                  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
              run: yarn install --immutable --immutable-cache

            - name: Validate CLI args
              id: validate-args
              env:
                  CLI_ARGS_INPUT: ${{ github.event.inputs.cliArgs }}
              run: |
                  if [ -z "$CLI_ARGS_INPUT" ]; then
                    echo "safe_args=" >> $GITHUB_OUTPUT
                    exit 0
                  fi

                  # Build allowlist from semantic-release help
                  ALLOWED_FLAGS=$(npx semantic-release -h | grep -oE '(-[a-z]|--[a-z-]+)' | sort -u | tr '\n' '|' | sed 's/|$//')

                  # Validate tokens: flags must be in allowlist, values must follow flags
                  PREV_WAS_FLAG=false
                  for TOKEN in $CLI_ARGS_INPUT; do
                    if echo "$TOKEN" | grep -qE '^-'; then
                      if ! echo "$TOKEN" | grep -qE "^($ALLOWED_FLAGS)$"; then
                        echo "Error: Invalid flag: $TOKEN"
                        exit 1
                      fi
                      PREV_WAS_FLAG=true
                    else
                      if [ "$PREV_WAS_FLAG" != "true" ]; then
                        echo "Error: Value must follow a flag: $TOKEN"
                        exit 1
                      fi
                      PREV_WAS_FLAG=false
                    fi
                  done

                  # Preventive escaping
                  SAFE_ARGS=$(printf "%q" "$CLI_ARGS_INPUT")
                  echo "safe_args=$SAFE_ARGS" >> $GITHUB_OUTPUT

            - name: Dry-run semantic-release
              id: dry-run
              # bash with pipefail: a semantic-release failure must fail the step even through the tee pipe
              shell: bash
              env:
                  # The default token is enough for a dry-run: it has write access for the push check and the GitHub plugin skips the permission check inside Actions
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # A private package makes the npm plugin skip the registry auth, so the dry-run needs no npm token.
                  # This edit lives only in this throwaway checkout; the release job checks out the code again.
                  npm pkg set private=true --json

                  npx semantic-release --dry-run ${{ steps.validate-args.outputs.safe_args }} 2>&1 | tee dry-run.log

                  NEXT_VERSION=$(sed -E 's/\x1b\[[0-9;]*m//g' dry-run.log | sed -nE 's/.*The next release version is ([^ ]+).*/\1/p' | tail -1)
                  echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

                  if [ -n "$NEXT_VERSION" ]; then
                    echo "## Next release: \`$NEXT_VERSION\`" >> $GITHUB_STEP_SUMMARY
                    echo "Approve the **Release** job to publish it. Reject it if the version is not the one you expect." >> $GITHUB_STEP_SUMMARY
                  else
                    echo "## No release" >> $GITHUB_STEP_SUMMARY
                    echo "semantic-release found no relevant changes. Read the log of the dry-run step for details." >> $GITHUB_STEP_SUMMARY
                  fi

    release:
        name: Release
        needs: validate
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        # Requires manual approval to run - protects GH_TOKEN_MISTICA and NPM_PUBLISH_TOKEN secrets
        environment: production
        steps:
            - uses: actions/checkout@v6
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  # persist-credentials: false - git remote configured manually in Release step with GH_TOKEN_MISTICA
                  persist-credentials: false

            - name: Install dependencies
              env:
                  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
              run: yarn install --immutable --immutable-cache

            - name: Husky install
              if: steps.yarn-cache.outputs.cache-hit == 'true'
              run: yarn husky install

            - name: 'Set npm token'
              uses: './.github/actions/set-npm-token'
              with:
                  npm-token: ${{ secrets.NPM_PUBLISH_TOKEN }}

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN_MISTICA }}
                  NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
              run: |
                  # Configure git remote with token for push
                  git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
                  npx semantic-release ${{ needs.validate.outputs.safe_args }}
