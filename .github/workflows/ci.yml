# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    merge_group:
        branches: [master]

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.64.1-noble
            options: --ipc=host

        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable --immutable-cache

            - run: yarn lint
            - run: yarn prettier-check
            - run: yarn circular-dependencies
            - run: yarn build
            - run: yarn ts-check
            - run: yarn test
            - run: NO_BUILD=true yarn test-ssr

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: failed-screenshots-ssr
                  path: reports/playwright/**/*-diff.png

    build-acceptance:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.64.1-noble
            options: --ipc=host
        strategy:
            matrix:
                shard: [1, 2, 3]
            fail-fast: false

        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable --immutable-cache

            - run: yarn storybook-static
            - run: yarn test-acceptance --shard=${{ matrix.shard }}/${{ strategy.job-total }}

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: failed-screenshots-${{ matrix.shard }}
                  path: reports/playwright/**/*-diff.png

    build-upload-failed-screenshots:
        runs-on: ubuntu-latest
        needs: [build, build-acceptance]
        if: '!cancelled()'

        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable --immutable-cache

            - if: needs.build.result == 'failure' || needs.build-acceptance.result == 'failure'
              uses: actions/download-artifact@v4
              with:
                  pattern: failed-screenshots-*
                  merge-multiple: true
                  path: reports/playwright/

            - name: 'Upload failed screenshot diffs'
              uses: './.github/actions/upload-failed-screenshots'
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  azure-account-name: ${{ secrets.AZURE_ACCOUNT_NAME }}
                  azure-account-key: ${{ secrets.AZURE_ACCOUNT_KEY }}
                  fork-pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

    validate-pr-title:
        # This job validates the PR title against the conventional commit format. Needed for semantic-release to generate release notes.
        name: Validate PR title
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        steps:
            - uses: amannn/action-semantic-pull-request@v5
              with:
                  types: |
                      fix
                      feat
                      chore
                      revert
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Disallow breaking change marker (!)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  PR_TITLE=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json title -q .title)
                  if echo "$PR_TITLE" | grep -q '^[^:]*!:'; then
                    echo "Error: PR titles must not use '!' to indicate breaking changes. Use a BREAKING CHANGE footer in the PR description instead."
                    exit 1
                  fi

    ci-required-checks:
        name: CI required checks passed
        runs-on: ubuntu-latest
        needs: [build, build-acceptance, validate-pr-title]
        if: always()
        steps:
            - name: Check that all required jobs succeeded
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: |
                  echo "One or more required CI jobs failed or were cancelled."
                  exit 1
            - name: All required jobs succeeded
              run: echo "All required CI jobs passed."
###
