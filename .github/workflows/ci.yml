# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    merge_group:
        branches: [master]

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.64.1-noble
            options: --ipc=host

        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable --immutable-cache

            - run: yarn lint
            - run: yarn prettier-check
            - run: yarn circular-dependencies
            - run: yarn build
            - run: yarn ts-check
            # The root tsconfig excludes packages, and the generator shares the density definitions of src.
            # The generator has its own yarn.lock, so it is a separate Yarn project that the root install skips
            - run: cd packages/generate-design-tokens && yarn install --immutable && yarn typecheck
            - run: yarn test --ci
            # Playwright reads CI=true from GitHub Actions.
            - run: NO_BUILD=true yarn test-ssr

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: failed-screenshots-ssr
                  path: reports/playwright/**/*-diff.png

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: blob-report-ssr
                  path: reports/playwright-blob/
                  if-no-files-found: ignore
                  retention-days: 1

    build-acceptance:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.64.1-noble
            options: --ipc=host
        strategy:
            matrix:
                shard: [1, 2, 3]
            fail-fast: false

        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable --immutable-cache

            - run: yarn storybook-static
            - run: yarn test-acceptance --shard=${{ matrix.shard }}/${{ strategy.job-total }}

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: failed-screenshots-${{ matrix.shard }}
                  path: reports/playwright/**/*-diff.png

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: blob-report-${{ matrix.shard }}
                  path: reports/playwright-blob/
                  if-no-files-found: ignore
                  retention-days: 1

    build-test-report:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [build, build-acceptance]
        if: '!cancelled()'
        permissions:
            contents: read
            actions: write

        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable --immutable-cache

            - uses: actions/download-artifact@v4
              with:
                  pattern: blob-report-*
                  merge-multiple: true
                  path: reports/playwright-blob/

            # A job that fails before its tests has no blob, so the merge runs only if a blob exists.
            - if: hashFiles('reports/playwright-blob/*.zip') != ''
              run: yarn playwright merge-reports --config playwright.merge.config.ts reports/playwright-blob

            - if: hashFiles('reports/playwright-blob/*.zip') != ''
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-html
                  path: reports/playwright-merged/html/

            - if: hashFiles('reports/playwright-blob/*.zip') != ''
              run: node scripts/prepare-playwright-json-report.js

            - if: hashFiles('reports/playwright-blob/*.zip') != ''
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-json
                  path: reports/playwright-merged/json/

            # The blobs of every job are only an input of the merge, so the run keeps only the two merged reports.
            # The token of a fork PR cannot delete artifacts, so there the blobs expire after their one day retention.
            - name: Delete the blob reports
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
                      --jq '.artifacts[] | select(.name | startswith("blob-report-")) | .id' |
                      xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"

    build-upload-failed-screenshots:
        runs-on: ubuntu-latest
        needs: [build, build-acceptance]
        if: '!cancelled()'
        permissions:
            contents: read
            pull-requests: write
            actions: write

        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable --immutable-cache

            - if: needs.build.result == 'failure' || needs.build-acceptance.result == 'failure'
              uses: actions/download-artifact@v4
              with:
                  pattern: failed-screenshots-*
                  merge-multiple: true
                  path: reports/playwright/

            - uses: actions/upload-artifact@v4
              with:
                  name: failed-screenshots
                  path: reports/playwright/**/*-diff.png
                  if-no-files-found: ignore

            # Every test job uploads its own diffs, so the run keeps only the single zip above.
            - name: Delete the failed screenshots of every job
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
                      --jq '.artifacts[] | select(.name | startswith("failed-screenshots-")) | .id' |
                      xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"

            - name: 'Upload failed screenshot diffs'
              uses: './.github/actions/upload-failed-screenshots'
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  azure-account-name: ${{ secrets.AZURE_ACCOUNT_NAME }}
                  azure-account-key: ${{ secrets.AZURE_ACCOUNT_KEY }}
                  fork-pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

    validate-pr-title:
        # This job validates the PR title against the conventional commit format. Needed for semantic-release to generate release notes.
        name: Validate PR title
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        steps:
            - uses: amannn/action-semantic-pull-request@v5
              with:
                  types: |
                      fix
                      feat
                      chore
                      revert
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Disallow breaking change marker (!)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  PR_TITLE=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json title -q .title)
                  if echo "$PR_TITLE" | grep -q '^[^:]*!:'; then
                    echo "Error: PR titles must not use '!' to indicate breaking changes. Use a BREAKING CHANGE footer in the PR description instead."
                    exit 1
                  fi

    ci-required-checks:
        name: CI required checks passed
        runs-on: ubuntu-latest
        needs: [build, build-acceptance, validate-pr-title]
        if: always()
        steps:
            - name: Check that all required jobs succeeded
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: |
                  echo "One or more required CI jobs failed or were cancelled."
                  exit 1
            - name: All required jobs succeeded
              run: echo "All required CI jobs passed."
###
