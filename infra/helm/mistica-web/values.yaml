resourceNamePrefix: true

docker:
    registry: ''
    project: ''
    repoPrefix: mistica-web/services

image:
    tag: latest

imagePullSecret:
    name: ''
    dockerconfigjson: ''

service:
    replicas: 1
    port: 80
    containerPort: 8080
    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 250m
            memory: 256Mi
    probes:
        startup:
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 2
        liveness:
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
        readiness:
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2

route:
    enabled: false
    public: false
    host: ''
    tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
        acme: false
