{{- if .Values.imagePullSecret.dockerconfigjson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mistica-web.resourceName" (list . .Values.imagePullSecret.name) }}
  labels:
    {{- include "mistica-web.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePullSecret.dockerconfigjson | quote }}
{{- end }}
