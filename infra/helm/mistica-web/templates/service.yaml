apiVersion: v1
kind: Service
metadata:
  name: {{ include "mistica-web.resourceName" (list . "web") }}
  labels:
    {{- include "mistica-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
